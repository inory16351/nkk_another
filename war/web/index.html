<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쥐들의 전쟁</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece4cc; --dim: #a59c84; --panel: rgba(34, 30, 24, 0.9); --panel2: #2b251d; --line: rgba(236, 228, 204, 0.16); --rat: #8fd0ff; --cat: #ff6b5b; --gold: #ffcf4a; --psy: #c9a3ff; --ok: #9fdc8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #2a251e; color: var(--ink); font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; overflow: hidden; user-select: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .dim { color: var(--dim); } .neg { color: var(--cat); } .psy { color: var(--psy); } .gold { color: var(--gold); } .pos { color: var(--rat); } .warn { color: var(--gold); }
  /* ── 패널 · 버튼 (UI 키트 그림이 있으면 border-image 로 덮음) ── */
  .panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  .btn { padding: 9px 16px; background: #5a4a2e; color: var(--ink); border: 1px solid #b39552; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.25); }
  .btn:hover:not(:disabled) { background: #6c5935; } .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.big { padding: 13px 34px; font-size: 18px; letter-spacing: 4px; background: #7a3b28; border-color: var(--gold); }
  .chip { display: inline-block; padding: 1px 7px; margin: 2px 3px 2px 0; border-radius: 10px; background: rgba(236,228,204,0.1); border: 1px solid var(--line); font-size: 11px; }
  .chip.rare { border-color: var(--psy); color: var(--psy); }
  .sbar { height: 5px; background: rgba(0,0,0,0.45); border-radius: 3px; overflow: hidden; margin: 3px 0; } .sbar i { display: block; height: 100%; }
  canvas.portrait { display: block; border-radius: 6px; background: radial-gradient(circle at 50% 35%, #6b6250, #3a332a); }
  canvas.portrait.dead { background: #2a2622; }
  /* ── 전투 HUD ── */
  #top { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; background: var(--panel); padding: 7px 18px; border-radius: 6px; border: 1px solid var(--line); font-size: 14px; }
  #turn.rat { color: var(--rat); } #turn.cat { color: var(--cat); } #shells { color: var(--dim); }
  #mission { position: fixed; top: 12px; left: 12px; width: 240px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 6px; padding: 8px 11px; font-size: 13px; }
  #mission .mh { font-weight: 800; color: var(--gold); margin-bottom: 4px; } #mission .mo.ok { color: var(--ok); text-decoration: line-through; } #mission .mr { color: var(--dim); font-size: 11px; margin-top: 4px; }
  #log { position: fixed; top: 12px; right: 12px; width: 300px; font-size: 13px; pointer-events: none; }
  #log .l { background: var(--panel); padding: 4px 9px; margin-bottom: 3px; border-radius: 4px; border-left: 3px solid var(--line); }
  #log .good { border-left-color: var(--rat); } #log .bad { border-left-color: var(--cat); } #log .warn { border-left-color: var(--gold); } #log .title { border-left-color: var(--gold); color: var(--gold); }
  #squad { position: fixed; left: 12px; top: 112px; display: flex; flex-direction: column; gap: 5px; width: 206px; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; display: flex; gap: 10px; align-items: stretch; max-width: calc(100vw - 260px - 200px); }
  #selp { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 8px 8px; min-width: 230px; }
  #selp .big { flex: none; } #selp .nm { font-weight: 800; font-size: 15px; } #selp .cl { color: var(--gold); font-size: 12px; } #selp .st { font-size: 12px; color: var(--dim); }
  #selp .tr { margin-top: 2px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px 5px 54px; min-height: 52px; cursor: pointer; }
  .card .pf { position: absolute; left: 5px; top: 4px; }
  .card.sel { border-color: var(--rat); box-shadow: 0 0 0 1px var(--rat) inset; }
  .card.dead { opacity: 0.45; }
  .card .nm { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; } .card .cl { color: var(--dim); font-size: 11px; }
  .card .hp { display: flex; gap: 2px; margin: 3px 0; flex-wrap: wrap; } .card .hp i { width: 7px; height: 6px; background: rgba(0,0,0,0.45); } .card .hp i.on { background: var(--rat); }
  .card .st { font-size: 10px; color: var(--dim); }
  #abil { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .ab { position: relative; min-width: 64px; padding: 7px 8px 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ab:hover { border-color: var(--ink); } .ab.on { border-color: var(--gold); color: var(--gold); } .ab.psi { border-color: rgba(201,163,255,0.5); }
  .ab.off { opacity: 0.38; cursor: default; }
  .ab .ic { font-size: 17px; } .ab .hk { position: absolute; top: 2px; left: 5px; font-size: 10px; color: var(--dim); }
  #endturn { position: fixed; right: 12px; bottom: 12px; padding: 16px 22px; font-size: 16px; background: #5a4a2e; color: var(--ink); border: 1px solid var(--gold); border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
  #endturn:disabled { opacity: 0.4; cursor: default; }
  #tip { position: fixed; right: 12px; bottom: 80px; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 12px; display: none; }
  .tip-h { display: flex; justify-content: space-between; } .tip-h span { color: var(--dim); }
  .tip-big { font-size: 26px; font-weight: 800; margin: 4px 0; } .tip-big small { font-size: 11px; color: var(--dim); margin: 0 10px 0 3px; font-weight: 400; }
  .tip-r { display: flex; justify-content: space-between; color: var(--dim); } .tip-k { margin-top: 6px; color: var(--dim); font-size: 11px; }
  #banner { position: fixed; top: 36%; left: 0; right: 0; text-align: center; font-size: 34px; font-weight: 800; letter-spacing: 2px; opacity: 0; transition: opacity 0.25s; pointer-events: none; text-shadow: 0 2px 0 #1b1712; }
  #banner.show { opacity: 1; } #banner.rat { color: var(--rat); } #banner.cat { color: var(--cat); }
  #help { position: fixed; left: 12px; bottom: 12px; font-size: 11px; color: var(--dim); background: var(--panel); padding: 4px 9px; border-radius: 4px; }
  body.in-lobby #top, body.in-lobby #mission, body.in-lobby #log, body.in-lobby #bar, body.in-lobby #help, body.in-lobby #tip, body.in-lobby #squad, body.in-lobby #endturn { display: none; }
  @media (max-width: 1100px) { #squad { width: 160px; } #bar { max-width: calc(100vw - 200px - 150px); } #selp { display: none; } }
  #end { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 17, 13, 0.82); z-index: 20; }
  .endp { width: min(640px, calc(100vw - 32px)); max-height: 90vh; overflow: auto; }
  .endp h1 { margin: 0 0 4px; font-size: 32px; } .endp h1.win { color: var(--gold); } .endp h1.lose { color: var(--cat); }
  .rep { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; } .rep.dead { color: #d8b0a8; }
  .btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  /* ── 사령부 (로비) ── */
  #lobby { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 10; background: #1e1a15 center/cover no-repeat; }
  #lobby::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,12,0.55), rgba(20,16,12,0.85)); pointer-events: none; }
  #lobby > * { position: relative; }
  .lb-top { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: rgba(20,17,13,0.85); border-bottom: 1px solid var(--line); }
  .lb-top h1 { margin: 0; font-size: 22px; letter-spacing: 2px; } .lb-top h1 small { color: var(--dim); font-size: 13px; font-weight: 400; margin-left: 8px; }
  .lb-top .res { margin-left: auto; display: flex; gap: 16px; font-size: 14px; } .lb-top .res b { color: var(--gold); }
  .lb-main { flex: 1; display: flex; min-height: 0; }
  .lb-tabs { width: 150px; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; background: rgba(20,17,13,0.6); }
  .tab { padding: 12px 10px; background: rgba(58,48,36,0.8); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left; }
  .tab.on { background: #6b5432; border-color: var(--gold); color: var(--gold); }
  .tab small { display: block; font-size: 11px; font-weight: 400; color: var(--dim); }
  #lb-reset { margin-top: auto; font-size: 11px; opacity: 0.6; }
  #lb-body { flex: 1; overflow: auto; padding: 16px 20px; }
  .ops { display: flex; gap: 16px; align-items: flex-start; }
  .missions { width: 260px; display: flex; flex-direction: column; gap: 8px; }
  .mcard { text-align: left; padding: 12px; background: rgba(43,37,29,0.92); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; cursor: pointer; }
  .mcard.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; } .mcard.lock { opacity: 0.45; cursor: default; } .mcard.done .ms { color: var(--ok); }
  .mcard .mn { font-weight: 800; } .mcard .ms { font-size: 12px; color: var(--gold); margin-top: 3px; }
  .brief { flex: 1; } .brief .bh { display: flex; align-items: baseline; gap: 12px; } .brief h2 { margin: 0; } .reward { color: var(--gold); font-weight: 700; }
  .brief p { color: #d8cfb5; line-height: 1.6; } .obj { font-size: 13px; color: var(--dim); } .obj b { color: var(--ink); }
  .brief h3, .detail h3 { font-size: 14px; margin: 16px 0 8px; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { min-height: 70px; border: 1px dashed rgba(236,228,204,0.25); border-radius: 6px; cursor: pointer; }
  .bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; margin-top: 10px; }
  .mini { display: flex; gap: 8px; align-items: center; padding: 6px; background: rgba(58,48,36,0.7); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 12px; }
  .mini:hover { border-color: var(--ink); } .mini.off { opacity: 0.45; cursor: default; } .mini.shaky { border-color: rgba(201,163,255,0.6); }
  .mini .mi { flex: 1; display: flex; flex-direction: column; } .mini .mi span { color: var(--dim); font-size: 11px; }
  .go-row { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 16px; } .go-row .warn { font-size: 13px; }
  .squad { display: flex; gap: 16px; align-items: flex-start; }
  .cards { width: 330px; display: flex; flex-direction: column; gap: 6px; }
  .rcard { display: flex; gap: 10px; padding: 8px; background: rgba(43,37,29,0.92); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 12px; }
  .rcard.on { border-color: var(--gold); } .rcard.pts { box-shadow: 0 0 0 1px rgba(255,207,74,0.4) inset; }
  .rcard .ri { flex: 1; display: flex; flex-direction: column; } .rcard .ri span { color: var(--dim); } .rcard .pt { color: var(--gold) !important; font-weight: 700; }
  .detail { flex: 1; } .dh { display: flex; gap: 16px; } .dh h2 { margin: 0; } .dh .cls { color: var(--gold); font-weight: 700; margin: 2px 0; }
  .story { font-style: italic; color: #d8cfb5; margin: 8px 0; } .stress { display: flex; gap: 8px; align-items: center; font-size: 12px; } .stress .sbar { width: 140px; }
  .stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .stats div { background: rgba(0,0,0,0.25); border-radius: 5px; padding: 5px; text-align: center; font-size: 11px; } .stats span { display: block; color: var(--dim); } .stats b { font-size: 15px; }
  .abil-list { margin-top: 8px; }
  .hex { display: flex; justify-content: center; } .hexsvg { width: min(520px, 100%); height: auto; }
  .hexsvg .cell { fill: rgba(0,0,0,0.35); stroke: var(--c); stroke-opacity: 0.35; stroke-width: 2; transition: fill 0.15s; }
  .hexsvg .cell.own { fill: var(--c); fill-opacity: 0.75; stroke-opacity: 1; }
  .hexsvg .cell.can { stroke: var(--gold); stroke-opacity: 1; stroke-width: 3; cursor: pointer; fill: rgba(255,207,74,0.12); }
  .hexsvg .cell.can:hover { fill: rgba(255,207,74,0.35); }
  .hexsvg .ci { pointer-events: none; opacity: 0.45; filter: grayscale(0.7); } .hexsvg .ci.own { opacity: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)); } .hexsvg .ci.can { opacity: 0.85; filter: none; }
  .hexsvg .ct { font-size: 10px; fill: #e9dfc2; pointer-events: none; font-family: var(--f-body); font-weight: 600; } .hexsvg .ct.own { fill: #1c1813; font-weight: 700; }
  .hexsvg .sec { font-size: 17px; font-family: var(--f-head); paint-order: stroke; stroke: #1c1813; stroke-width: 3px; }
  .hex-tip { text-align: center; font-size: 12px; min-height: 18px; }
  .recruit .rhead { display: flex; align-items: center; gap: 16px; } .cands { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .cand { width: 250px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; } .cand h2 { margin: 4px 0 0; } .cand .btn { margin-top: auto; align-self: stretch; }
  .memorial h2 { margin-top: 0; } .stones { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  .stone { display: flex; gap: 12px; align-items: center; padding: 10px; background: rgba(30,27,24,0.9); border: 1px solid #5a5248; border-radius: 4px; font-size: 13px; }
  .memorial.empty p { color: var(--dim); font-style: italic; }
  #lb-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #6b5432; border: 1px solid var(--gold); padding: 10px 18px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 30; }
  #lb-toast.show { opacity: 1; }
  #title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 17, 13, 0.88); z-index: 40; }
  #title .panel { width: min(560px, calc(100vw - 32px)); } #title h1 { margin: 0 0 6px; font-size: 30px; } #title p { color: var(--dim); line-height: 1.6; }
  .villain { display: flex; gap: 16px; align-items: center; } .villain img { width: 110px; height: auto; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); z-index: 50; background: #1e1a15; }

  /* ── UI 키트 그림 (art/out/ui, tools/ui_kit.py) ── */
  .panel, #mission, #selp, #abil, #tip, .mcard, .rcard, .cand, .stone, .card, #log .l, .mini {
    border: 14px solid transparent; border-image: url(../art/out/ui/panel.png) 64 fill / 14px stretch; background: none; box-shadow: 0 6px 18px rgba(0,0,0,0.35); border-radius: 0; }
  .card, .mini, #log .l { border-width: 10px; border-image-width: 10px; }
  .mcard.on, .rcard.on, .card.sel { border-image-source: url(../art/out/ui/panel_sq.png); filter: drop-shadow(0 0 4px rgba(255,207,74,0.55)); }
  .btn, .ab, .tab, #endturn, .btns button { border: 10px solid transparent; border-image: url(../art/out/ui/btn.png) 34 fill / 10px stretch; background: none; box-shadow: none; border-radius: 0; color: #f1e8cc; text-shadow: 0 1px 0 #1c1712; }
  .btn:hover:not(:disabled), .ab:hover, .tab:hover, .tab.on, .ab.on { border-image-source: url(../art/out/ui/btn_hi.png); background: none; }
  .btn:disabled, .ab.off { border-image-source: url(../art/out/ui/btn_off.png); }
  .btn.big, #endturn { border-image-source: url(../art/out/ui/btn_red.png); border-image-slice: 38 fill; }
  #top, .lb-top { border: 12px solid transparent; border-image: url(../art/out/ui/header.png) 40 60 fill / 12px 18px stretch; background: none; }
  .lb-top { border-radius: 0; }
  .sbar { background: url(../art/out/ui/bar.png) center / 100% 100%; height: 7px; padding: 1px 3px; }
  .panel .dim, .mcard .ms, .mini .mi span, .rcard .ri span, .card .cl, .card .st, .obj, .brief p, .story { color: #ddd2b2; }
  .panel h2, .panel h3, .mcard .mn, .rcard b, .mini b, .card .nm { color: #fff3d6; text-shadow: 0 1px 0 rgba(0,0,0,0.6); }
  .card .pf canvas.portrait, .mini canvas.portrait, .rcard canvas.portrait { border-radius: 50%; box-shadow: 0 0 0 3px #b48a3c, 0 0 0 5px #3a2c1c; }

  /* ── 스트레스 글자 · 출전/대기 · 선택 표시 ── */
  .stl { display: flex; justify-content: space-between; font-size: 11px; margin-top: 2px; } .stl span { color: #cfc4a4; } .stl b { font-weight: 700; }
  .sec-h { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px; margin: 14px 0 8px !important; border-left: 4px solid; background: rgba(0,0,0,0.25); }
  .sec-h span { font-family: var(--f-head); font-size: 18px; } .sec-h small { color: #cfc4a4; font-weight: 400; font-size: 12px; margin-left: auto; }
  .sec-h.go { border-color: var(--gold); color: var(--gold); } .sec-h.rest { border-color: #7d8fa8; color: #b8c6d8; }
  .slot { position: relative; border: 2px dashed rgba(255,207,74,0.45) !important; background: rgba(255,207,74,0.05); }
  .slot em { position: absolute; left: -9px; top: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #1c1813; font: 14px/22px var(--f-head); text-align: center; font-style: normal; z-index: 2; }
  .mini.going { filter: drop-shadow(0 0 5px rgba(255,207,74,0.6)); }
  .mini.resting { opacity: 0.82; filter: saturate(0.7); } .mini.resting:hover { opacity: 1; filter: none; }
  .card.sel { transform: translateX(8px); filter: drop-shadow(0 0 8px rgba(255,207,74,0.9)); }
  .card.done { opacity: 0.55; filter: grayscale(0.5); }
  .card .now { position: absolute; right: -4px; top: -18px; padding: 1px 7px; background: #3a2c1c; border-radius: 3px; font: 11px var(--f-head); color: var(--gold); z-index: 3; } .card .now.done { color: #a9a08a; }
  /* ── 글꼴 · 가시성: 제목 · 버튼 = Black Han Sans (군용 스텐실 느낌), 본문 = IBM Plex Sans KR, 사연 · 추모 = Gowun Batang ── */
  :root { --f-head: "Black Han Sans", "Malgun Gothic", sans-serif; --f-body: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; --f-story: "Gowun Batang", "Batang", serif; }
  html, body { font-family: var(--f-body); font-size: 14px; }
  h1, h2, .tab, .btn, #endturn, .mcard .mn, #banner, #turn, #mission .mh, .lb-top h1, .card .nm, #selp .nm, .ab .an, .reward, .cls, .endp h1 { font-family: var(--f-head); font-weight: 400; letter-spacing: 0.5px; }
  .story, .stone .story, .rep .dim { font-family: var(--f-story); }
  #banner { font-size: 44px; letter-spacing: 6px; text-shadow: 0 3px 0 #1b1712, 0 0 18px rgba(0,0,0,0.6); }
  .ab { min-width: 74px; padding: 8px 9px 6px; font-size: 13px; } .ab .ic { font-size: 22px; } .ab .hk { font-size: 11px; color: #f0d48a; }
  .ab.off { opacity: 0.45; filter: grayscale(0.6); }
  #log { width: 320px; } #log .l { font-size: 13px; color: #f4ecd4; }
  #mission { width: 250px; font-size: 13px; } #mission .mh { font-size: 16px; }
  .card .nm { font-size: 14px; } .card .cl { font-size: 12px; }
  #selp .nm { font-size: 18px; } #selp .st { font-size: 13px; color: #e6dcbc; }
  #tip { font-size: 13px; } .tip-big { font-size: 30px; font-family: var(--f-head); font-weight: 400; }
  .mcard .mn { font-size: 16px; } .brief h2, .dh h2, .cand h2 { font-size: 26px; }
  .lb-top h1 { font-size: 26px; } .tab { font-size: 18px; } .tab small { font-family: var(--f-body); font-size: 11px; }
  .chip { font-size: 12px; padding: 2px 8px; background: rgba(20,16,12,0.55); color: #f1e6c6; }

  .ab .ic img { width: 34px; height: 34px; display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)); }
  .ab.off .ic img { filter: grayscale(1) brightness(0.7); }

    <div class="res"><span>보급품 <b id="lb-sup">0</b></span><span>분대 <b id="lb-sq">0</b></span><span>치른 전투 <b id="lb-bat">0</b></span></div></div>

      <h1>쥐들의 전쟁</h1>
      <p>총통 고양이의 군대가 마을을 집어삼켰다.<br>지하 사령부에서 분대를 꾸려 하나씩 되찾아라.</p>

<script>
  (async () => {
    await View.load();
    document.getElementById('loading').remove();
    document.getElementById('fuhrer').src = View.IM.boss_fuhrer.src;
    if (View.IM.lobby_bg) document.getElementById('lobby').style.backgroundImage = `url(${View.IM.lobby_bg.src})`;
    Lobby.init();
    // 로비 뒤로 첫 임무 전장을 깔아 둠 (캔버스가 비지 않게)
    startBattle();
    View.start();
    document.body.classList.add('in-lobby');
    const go = () => { document.getElementById('title').style.display = 'none'; Lobby.show(); };
    document.getElementById('go').onclick = go;
    document.getElementById('endturn').onclick = () => endRatTurn();
    const q = new URLSearchParams(location.search);
    if (q.has('go')) { document.getElementById('title').style.display = 'none'; Lobby.hide(); View.reset(); startBattle(); UI.restart(); }
    else if (q.has('hq')) go();
  })().catch((e) => { console.error(e); const l = document.getElementById('loading'); if (l) l.textContent = '오류: ' + e.message; });
</script>
